services:

  # ==========================================================
  # Apache
  # ==========================================================

  apache:
    build:
      context: ./apache
    container_name: multidomain-apache

    ports:
      - "80:80"

    volumes:
      - ./src/sites/main/php:/var/www/sites/main:ro
      - ./src/sites/admin/php:/var/www/sites/admin:ro
      - ./src/shared/php:/var/www/shared:ro

    depends_on:
      - php-main
      - php-admin

    networks:
      - web

  # ==========================================================
  # Main localhost site
  # ==========================================================

  php-main:
    image: php:8.5-fpm
    container_name: multidomain-php-main

    volumes:
      - ./src/sites/main/php:/var/www/sites/main:ro
      - ./src/shared/php:/var/www/shared:ro
      - ./src/sites/main/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    cpus: "0.50"
    mem_limit: 512m

    networks:
      - web

  # ==========================================================
  # admin.localhost
  # ==========================================================

  php-admin:
    image: php:8.5-fpm
    container_name: multidomain-php-admin

    volumes:
      - ./src/sites/admin/php:/var/www/sites/admin:ro
      - ./src/shared/php:/var/www/shared:ro
      - ./src/sites/admin/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    cpus: "0.50"
    mem_limit: 512m

    networks:
      - web

  # ==========================================================
  # Sass compiler
  # ==========================================================

  sass:
    image: node:24-alpine
    container_name: multidomain-sass

    working_dir: /app

    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json:ro
      - sass-node-modules:/app/node_modules

    command: sh -c "npm install && npm run watch"

    networks:
      - web

  # ==========================================================
  # Postgres
  # ==========================================================

  postgres:
    image: postgres:17
    container_name: bookstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# ==========================================================
# Named volumes
# ==========================================================

volumes:
  sass-node-modules:
  postgres_data:

    # ==========================================================
    # Networks
    # ==========================================================

networks:
  web:
